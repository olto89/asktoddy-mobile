<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskToddy Quote Accuracy POC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .testing-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .testing-grid {
                grid-template-columns: 1fr;
            }
        }

        .test-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .test-card:hover {
            transform: translateY(-5px);
        }

        .test-card h3 {
            color: #2C3E50;
            font-size: 1.4rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .test-card h3 .icon {
            font-size: 1.6rem;
            margin-right: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2C3E50;
        }

        textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        textarea:focus, select:focus {
            border-color: #FF6B35;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .btn {
            background: #FF6B35;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background: #E55A2B;
        }

        .btn:disabled {
            background: #CCC;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff40;
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 4px solid #FF6B35;
            background: #F8F9FA;
            border-radius: 0 8px 8px 0;
        }

        .result-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-source {
            font-weight: 600;
            color: #2C3E50;
        }

        .result-timestamp {
            font-size: 12px;
            color: #666;
        }

        .result-content {
            white-space: pre-wrap;
            line-height: 1.5;
            color: #444;
        }

        .cost-breakdown {
            background: #E8F5E8;
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .cost-breakdown h4 {
            color: #2E7D32;
            margin-bottom: 10px;
        }

        .cost-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .confidence-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .error {
            background: #FFE5E5;
            border: 1px solid #FF5252;
            color: #C62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .presets {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: #E0E0E0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .preset-btn:hover {
            background: #D0D0D0;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-item {
            display: inline-block;
            margin: 0 15px;
            font-size: 14px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-ok { background: #4CAF50; }
        .status-error { background: #FF5252; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ AskToddy</h1>
            <p>Quote Accuracy POC Testing Interface</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator" id="serverStatus"></span>
                Server: <span id="serverStatusText">Checking...</span>
            </div>
            <div class="status-item">
                <span class="status-indicator" id="geminiStatus"></span>
                Gemini API: <span id="geminiStatusText">Checking...</span>
            </div>
        </div>

        <div class="testing-grid">
            <div class="test-card">
                <h3><span class="icon">🤖</span>Direct Gemini Test</h3>
                <p style="margin-bottom: 15px; color: #666;">Test the Gemini API directly for basic quote responses</p>
                
                <div class="form-group">
                    <label for="geminiMessage">Construction Query:</label>
                    <textarea id="geminiMessage" rows="3" placeholder="e.g., I want to renovate my bathroom - it's 3m x 2.5m..."></textarea>
                    <div class="presets">
                        <button class="preset-btn" onclick="setPreset('gemini', 'bathroom')">Bathroom</button>
                        <button class="preset-btn" onclick="setPreset('gemini', 'kitchen')">Kitchen</button>
                        <button class="preset-btn" onclick="setPreset('gemini', 'extension')">Extension</button>
                    </div>
                </div>

                <button class="btn" onclick="testGemini()" id="geminiBtn">
                    Test Gemini API
                </button>
            </div>

            <div class="test-card">
                <h3><span class="icon">⚡</span>AskToddy Edge Function</h3>
                <p style="margin-bottom: 15px; color: #666;">Test the full AskToddy mobile backend with pricing engine</p>
                
                <div class="form-group">
                    <label for="edgeMessage">Construction Query:</label>
                    <textarea id="edgeMessage" rows="3" placeholder="e.g., I want to build a rear extension - 25m² single storey..."></textarea>
                    <div class="presets">
                        <button class="preset-btn" onclick="setPreset('edge', 'bathroom')">Bathroom</button>
                        <button class="preset-btn" onclick="setPreset('edge', 'kitchen')">Kitchen</button>
                        <button class="preset-btn" onclick="setPreset('edge', 'extension')">Extension</button>
                    </div>
                </div>

                <button class="btn" onclick="testEdgeFunction()" id="edgeBtn">
                    Test Edge Function
                </button>
            </div>
        </div>

        <div class="results" id="results" style="display: none;">
            <h3>🎯 Test Results</h3>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        // Test presets
        const presets = {
            bathroom: "I want to renovate my bathroom - it's 3m x 2.5m with standard height. Need new tiles, toilet, sink, and shower. What's a realistic cost estimate?",
            kitchen: "I want to renovate my kitchen - it's 4m x 3m with standard height. Need new units, worktop, appliances, and flooring. What would this cost?",
            extension: "I want to build a single storey rear extension - 25m² to create an open plan kitchen/dining area. What's the cost breakdown?"
        };

        // Check server status on load
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                document.getElementById('serverStatus').className = 'status-indicator status-ok';
                document.getElementById('serverStatusText').textContent = 'Connected';
                
                if (status.geminiConfigured) {
                    document.getElementById('geminiStatus').className = 'status-indicator status-ok';
                    document.getElementById('geminiStatusText').textContent = 'Configured';
                } else {
                    document.getElementById('geminiStatus').className = 'status-indicator status-error';
                    document.getElementById('geminiStatusText').textContent = 'Missing API Key';
                }
            } catch (error) {
                document.getElementById('serverStatus').className = 'status-indicator status-error';
                document.getElementById('serverStatusText').textContent = 'Disconnected';
                document.getElementById('geminiStatus').className = 'status-indicator status-error';
                document.getElementById('geminiStatusText').textContent = 'Unknown';
            }
        }

        function setPreset(type, preset) {
            const textarea = document.getElementById(type === 'gemini' ? 'geminiMessage' : 'edgeMessage');
            textarea.value = presets[preset];
        }

        function showResults() {
            document.getElementById('results').style.display = 'block';
        }

        function addResult(source, response, data = {}) {
            const resultsContent = document.getElementById('resultsContent');
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            
            let content = `
                <div class="result-header">
                    <div class="result-source">${source}</div>
                    <div class="result-timestamp">${new Date().toLocaleTimeString()}</div>
                </div>
                <div class="result-content">${response}</div>
            `;

            if (data.costBreakdown) {
                content += `
                    <div class="cost-breakdown">
                        <h4>💰 Cost Breakdown</h4>
                        <div class="cost-item">
                            <span>Total Cost:</span>
                            <span>£${data.costBreakdown.totalCost?.min || 'N/A'} - £${data.costBreakdown.totalCost?.max || 'N/A'}</span>
                        </div>
                    </div>
                `;
            }

            if (data.confidence) {
                content += `<div class="confidence-badge">Confidence: ${data.confidence}%</div>`;
            }

            resultItem.innerHTML = content;
            resultsContent.insertBefore(resultItem, resultsContent.firstChild);
            showResults();
        }

        function addError(source, error) {
            const resultsContent = document.getElementById('resultsContent');
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            
            resultItem.innerHTML = `
                <div class="result-header">
                    <div class="result-source">${source}</div>
                    <div class="result-timestamp">${new Date().toLocaleTimeString()}</div>
                </div>
                <div class="error">❌ Error: ${error}</div>
            `;

            resultsContent.insertBefore(resultItem, resultsContent.firstChild);
            showResults();
        }

        async function testGemini() {
            const message = document.getElementById('geminiMessage').value.trim();
            if (!message) {
                alert('Please enter a construction query');
                return;
            }

            const btn = document.getElementById('geminiBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Testing...';

            try {
                const response = await fetch('/api/test-gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();
                
                if (result.success) {
                    addResult(result.source, result.response, { model: result.model });
                } else {
                    addError('Gemini API', result.error);
                }
            } catch (error) {
                addError('Gemini API', error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Test Gemini API';
            }
        }

        async function testEdgeFunction() {
            const message = document.getElementById('edgeMessage').value.trim();
            if (!message) {
                alert('Please enter a construction query');
                return;
            }

            const btn = document.getElementById('edgeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Testing...';

            try {
                const response = await fetch('/api/test-edge-function', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();
                
                if (result.success) {
                    addResult(result.source, result.response, {
                        costBreakdown: result.costBreakdown,
                        confidence: result.confidence,
                        sessionId: result.sessionId
                    });
                } else {
                    addError('Edge Function', result.error);
                }
            } catch (error) {
                addError('Edge Function', error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Test Edge Function';
            }
        }

        // Initialize
        checkStatus();
    </script>
</body>
</html>
